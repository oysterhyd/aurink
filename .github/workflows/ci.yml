name: CI

# Runs scripts/gate.sh (docs/05-delivery-plan.md §5.1). A push checks the root
# module: every check on Linux, the tests on the other platforms. The weekly and
# manual runs also cover all five targets and the modules under spikes/.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - LICENSE
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, gate: --test-only, full: --test-only --spikes }
          - { name: Linux, os: ubuntu-latest, gate: "", full: --all-targets --spikes }
          - { name: macOS, os: macos-latest, gate: --test-only, full: --test-only --spikes }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: Gate
        run: bash scripts/gate.sh ${{ github.event_name != 'push' && matrix.full || matrix.gate }}
