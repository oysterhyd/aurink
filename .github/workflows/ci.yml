name: CI

# Runs the merge gate, scripts/gate.sh (docs/05-delivery-plan.md §5.1), on every
# Go module in the repository. Linux runs every check for all five targets; the
# other platforms run the tests.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - LICENSE
  pull_request:
    paths-ignore:
      - "**/*.md"
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, gate: --test-only }
          - { name: Linux, os: ubuntu-latest, gate: --all-targets }
          - { name: macOS, os: macos-latest, gate: --test-only }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: Gate
        run: bash scripts/gate.sh ${{ matrix.gate }}
