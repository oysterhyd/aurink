name: Release

# Builds, signs, and uploads the Windows v1.0+ installer and auto-update
# manifests to a GitHub Releases draft on v* tags or manual dispatch (09 D15).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    name: Quality Gate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Verify tag matches mygo.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      - name: Run full gate
        shell: pwsh
        run: pwsh -NoProfile -File scripts/gate.ps1

  release-windows:
    name: Windows (amd64)
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Cache NSIS
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\mygo\nsis-*
          key: nsis-${{ hashFiles('go.sum') }}
      - name: Ensure draft GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v$(jq -r .version mygo.json)"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --title "Aurink $TAG" --notes-file CHANGELOG.md
          fi
      - name: Build and upload signed Windows release
        env:
          CGO_ENABLED: "0"
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        shell: pwsh
        run: go tool mygo build -platform windows/amd64 -upload
